[package]
name = "claviron-domains"
version = "0.2.1"
publish = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/domains"
homepage = "https://github.com/claviron/domains"
edition = "2024"
description = "Registrar-held domains for a Claviron edge: store, delegation, registrar-hosted records and synchronization over pooled registrar clients"
documentation = "https://docs.rs/claviron-domains"
keywords = ["domains", "dns", "registrar", "claviron"]
categories = ["network-programming"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-*"]

[features]
default = []
namecheap = ["dep:quick-xml"]
godaddy = []
tasks = ["claviron/tasks"]

[dependencies]
# Claviron facade
claviron = { version = "0.2.1", default-features = false, features = ["server", "hosting", "postgres", "clients"] }

# always-on (used by registry trait + provider base)
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0"
arc-swap = "1.9"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "gzip", "brotli", "deflate", "multipart", "form", "rustls"] }
url = { version = "2.5", features = ["serde"] }
hickory-proto = { version = "0.26", features = ["serde"] }
humantime-serde = "1"

# namecheap-only
quick-xml = { version = "0.42", optional = true, features = ["serialize"] }
